name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "LOCAL ATUAL:"
          pwd

          echo ""
          echo "ARQUIVOS DO REPOSITÓRIO:"
          find . -maxdepth 5 -type f -print

          echo ""
          echo "PROCURANDO ZIP:"
          find . -type f -iname "*.zip" -print

      - name: Extrair projeto
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "ZIP ENCONTRADO: $ZIP"

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

      - name: Localizar projeto Android
        run: |
          echo "Procurando projeto Android..."

          find projeto -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print

          SETTINGS=$(find projeto -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: nenhum settings.gradle ou settings.gradle.kts foi encontrado."
            echo ""
            echo "Conteúdo extraído:"
            find projeto -maxdepth 6 -type f -print
            exit 1
          fi

          ANDROID_PROJECT=$(dirname "$SETTINGS")

          echo "Projeto encontrado em: $ANDROID_PROJECT"
          echo "ANDROID_PROJECT=$ANDROID_PROJECT" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd "$ANDROID_PROJECT"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: AutomedNotificacoes-APK
          path: "${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
