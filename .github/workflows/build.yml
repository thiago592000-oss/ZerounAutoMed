name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar e extrair ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

      - name: Encontrar projeto Android
        run: |
          echo "Procurando app/build.gradle..."

          APP_GRADLE=$(find projeto -type f \( \
            -path "*/app/build.gradle" \
            -o -path "*/app/build.gradle.kts" \
          \) | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERRO: app/build.gradle ou app/build.gradle.kts não encontrado."
            echo ""
            echo "Arquivos encontrados:"
            find projeto -maxdepth 8 -type f -print
            exit 1
          fi

          ANDROID_PROJECT=$(dirname "$(dirname "$APP_GRADLE")")

          echo "Arquivo encontrado: $APP_GRADLE"
          echo "Projeto Android: $ANDROID_PROJECT"

          echo "ANDROID_PROJECT=$ANDROID_PROJECT" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ver tarefas Gradle
        run: |
          cd "$ANDROID_PROJECT"
          gradle tasks --all --no-daemon

      - name: Compilar APK
        run: |
          cd "$ANDROID_PROJECT"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: AutomedNotificacoes-APK
          path: "${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
