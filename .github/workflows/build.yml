name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          unzip -o AutomatedNotificacoes.zip -d projeto

      - name: Encontrar projeto Android
        run: |
          SETTINGS=$(find projeto -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts/settings.gradle não encontrado."
            exit 1
          fi
          echo "Projeto encontrado em: $(dirname "$SETTINGS")"
          echo "ANDROID_PROJECT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$ANDROID_PROJECT"
          gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AutomedNotificacoes-APK
          path: "${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk"
