name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "Arquivos do repositório:"
          ls -la
          echo ""
          echo "Procurando o ZIP:"
          find . -maxdepth 3 -type f -name "*.zip" -print

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q "./AutomatedNotificacoes.zip" -d projeto

      - name: Localizar projeto Android
        run: |
          echo "Procurando settings.gradle..."
          find projeto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

          SETTINGS=$(find projeto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: nenhum settings.gradle ou settings.gradle.kts foi encontrado."
            echo "Conteúdo do ZIP:"
            find projeto -maxdepth 5 -type f | head -300
            exit 1
          fi

          ANDROID_PROJECT=$(dirname "$SETTINGS")

          echo "Projeto encontrado em: $ANDROID_PROJECT"
          echo "ANDROID_PROJECT=$ANDROID_PROJECT" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd "$ANDROID_PROJECT"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: AutomedNotificacoes-APK
          path: "${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
